<svg width="620" height="560" viewBox="0 0 620 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="120" y1="120" x2="500" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6355E4"/>
      <stop offset="1" stop-color="#17A398"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6355E4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#17A398" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#14162B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- weicher Hintergrund-Glow -->
  <ellipse cx="310" cy="290" rx="250" ry="230" fill="url(#brandSoft)"/>

  <!-- organischer Marken-Körper -->
  <path d="M310 108c62-8 128 22 158 78 30 55 26 130-14 178-41 49-114 70-176 52-63-18-110-72-116-136-6-63 36-124 92-152 18-9 37-17 56-20z" fill="url(#brand)"/>
  <path d="M310 108c62-8 128 22 158 78 30 55 26 130-14 178-41 49-114 70-176 52" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" fill="none"/>

  <!-- Termin-Kachel oben rechts -->
  <g filter="url(#softShadow)">
    <rect x="392" y="96" width="176" height="112" rx="20" fill="#ffffff"/>
    <rect x="412" y="120" width="118" height="18" rx="9" fill="#6355E4"/>
    <rect x="412" y="150" width="76" height="12" rx="6" fill="#14162B" fill-opacity="0.25"/>
    <rect x="412" y="170" width="96" height="12" rx="6" fill="#14162B" fill-opacity="0.15"/>
  </g>

  <!-- Termin-Kachel links -->
  <g filter="url(#softShadow)">
    <rect x="44" y="252" width="176" height="112" rx="20" fill="#ffffff"/>
    <rect x="64" y="276" width="118" height="18" rx="9" fill="#17A398"/>
    <rect x="64" y="306" width="76" height="12" rx="6" fill="#14162B" fill-opacity="0.25"/>
    <rect x="64" y="326" width="96" height="12" rx="6" fill="#14162B" fill-opacity="0.15"/>
  </g>

  <!-- Termin-Kachel unten -->
  <g filter="url(#softShadow)">
    <rect x="330" y="396" width="176" height="112" rx="20" fill="#ffffff"/>
    <rect x="350" y="420" width="118" height="18" rx="9" fill="#6355E4"/>
    <rect x="350" y="450" width="76" height="12" rx="6" fill="#14162B" fill-opacity="0.25"/>
    <rect x="350" y="470" width="96" height="12" rx="6" fill="#14162B" fill-opacity="0.15"/>
  </g>

  <!-- Sparkles -->
  <path d="M132 128l6 16 16 6-16 6-6 16-6-16-16-6 16-6 6-16z" fill="#6355E4" fill-opacity="0.7"/>
  <path d="M520 300l5 13 13 5-13 5-5 13-5-13-13-5 13-5 5-13z" fill="#17A398" fill-opacity="0.7"/>
</svg>
